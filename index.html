<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Sitaratas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen card table — header bar, seat row, central trick area, private hand dock at the bottom. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #e2e7ef;
  --fg: #17202c;
  --muted: #5a6577;
  --line: #ccd4df;
  --accent: #1f5bc8;
  --accent-soft: #dce7fb;
  --accent-fg: #ffffff;
  --good: #1d7f48;
  --good-soft: #d9f0e2;
  --warn: #a5560a;
  --warn-soft: #f8e6d2;
  --card: #f6f7f9;
  --card-top: #ffffff;
  --card-edge: #d3d9e1;
  --card-inner: rgba(30, 45, 70, .06);
  --card-shadow: 0 1px 1px rgba(20, 32, 54, .06), 0 6px 16px -8px rgba(20, 32, 54, .28);
  --ink-red: #c22d38;
  --ink-black: #1a1f27;
  --shadow: 0 1px 2px rgba(20, 32, 54, .10), 0 4px 14px rgba(20, 32, 54, .08);
  --scrim: rgba(14, 20, 30, .55);
  --accent-tint: rgba(31, 91, 200, .07);
  --fire: #e8590c; --fire-soft: rgba(255, 112, 26, .45); --fire-tint: rgba(255, 140, 50, .10);
  --boom-0: #ffd23f; --boom-1: #ff7a1a; --boom-2: #1f5bc8; --turn-glow: rgba(31, 91, 200, .30); --turn-edge: rgba(31, 91, 200, .45);
  --flame-core: #fff3b0; --flame-mid: #ffb02e; --flame-edge: rgba(240, 80, 20, .85);
  --bad: #cc2f3a; --bad-soft: #f9dcdd; --bad-glow: rgba(214, 48, 60, .35); --good-glow: rgba(29, 127, 72, .35);
  --felt: #d9e2ef; --felt-hi: #eef3fa; --felt-rim: #c9d5e6;  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #19202a; --surface-2: #222b37; --fg: #e7ecf3; --muted: #98a4b5;
    --line: #2d3846; --accent: #6b9dff; --accent-soft: #1d2d4a; --accent-fg: #0a1222;
    --good: #5fd08f; --good-soft: #163527; --warn: #f0a35a; --warn-soft: #3b2814;
    --card: #e6e9ee; --card-top: #f7f8fa; --card-edge: #aab2be; --card-inner: rgba(30, 45, 70, .07); --ink-red: #c22d38; --ink-black: #1a1f27;
    --card-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 18px -8px rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --scrim: rgba(4, 7, 12, .7);
    --accent-tint: rgba(31, 91, 200, .10);
    --fire: #ff8a3d; --fire-soft: rgba(255, 128, 40, .42); --fire-tint: rgba(255, 128, 40, .12);
    --boom-0: #ffe066; --boom-1: #ff8a3d; --boom-2: #6b9dff; --turn-glow: rgba(107, 157, 255, .42); --turn-edge: rgba(107, 157, 255, .6);
    --flame-core: #fff6c4; --flame-mid: #ffa62b; --flame-edge: rgba(255, 84, 24, .9);
    --bad: #ff6b72; --bad-soft: #3d1a1d; --bad-glow: rgba(255, 90, 100, .38); --good-glow: rgba(95, 208, 143, .32);
    --felt: #18212d; --felt-hi: #253246; --felt-rim: #1d2836;    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #19202a; --surface-2: #222b37; --fg: #e7ecf3; --muted: #98a4b5;
  --line: #2d3846; --accent: #6b9dff; --accent-soft: #1d2d4a; --accent-fg: #0a1222;
  --good: #5fd08f; --good-soft: #163527; --warn: #f0a35a; --warn-soft: #3b2814;
  --card: #e6e9ee; --card-top: #f7f8fa; --card-edge: #aab2be; --card-inner: rgba(30, 45, 70, .07); --ink-red: #c22d38; --ink-black: #1a1f27;
    --card-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 18px -8px rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --scrim: rgba(4, 7, 12, .7);
    --accent-tint: rgba(31, 91, 200, .10);
    --fire: #ff8a3d; --fire-soft: rgba(255, 128, 40, .42); --fire-tint: rgba(255, 128, 40, .12);
    --boom-0: #ffe066; --boom-1: #ff8a3d; --boom-2: #6b9dff; --turn-glow: rgba(107, 157, 255, .42); --turn-edge: rgba(107, 157, 255, .6);
    --flame-core: #fff6c4; --flame-mid: #ffa62b; --flame-edge: rgba(255, 84, 24, .9);
    --bad: #ff6b72; --bad-soft: #3d1a1d; --bad-glow: rgba(255, 90, 100, .38); --good-glow: rgba(95, 208, 143, .32);
    --felt: #18212d; --felt-hi: #253246; --felt-rim: #1d2836;  color-scheme: dark;
}
html, body { height: 100%; }
html, body { overflow-x: clip; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
table { color: inherit; font-size: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

#app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.big { padding: 12px 22px; font-size: 17px; border-radius: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 16px; cursor: pointer; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* Home + setup */
.center-col { margin: auto; width: 100%; max-width: 520px; padding-block: 32px; display: flex; flex-direction: column; gap: 22px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 9vw, 84px); letter-spacing: -.03em; line-height: .95; }
.wordmark .dot { color: var(--ink-red); }
.lede { color: var(--muted); font-size: 17px; max-width: 42ch; }
.fan { display: flex; height: 92px; margin-top: 4px; }
.fan .card { margin-right: -34px; transform-origin: bottom center; }
/* Achievements: toasts and page */
.toasts { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; padding-inline: 16px; width: max-content; max-width: 100%; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--fg); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); animation: toastIn .35s cubic-bezier(.2, 1.3, .4, 1) both; }
.toast b { display: block; font-size: 16px; }
.toast .label { display: block; color: var(--accent); }
.toast-icon { font-size: 28px; line-height: 1; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
.ach-page { max-width: 760px; }
.ach-progress { display: flex; flex-direction: column; gap: 8px; }
.ach-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.ach-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
.ach { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.ach-icon { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--surface-2); }
.ach:not(.got) .ach-icon { filter: grayscale(1); opacity: .45; }
.ach:not(.got) b { color: var(--muted); }
.ach.got { border-color: var(--accent); }
.ach.got .ach-icon { background: var(--accent-soft); }
.ach-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ach-date { font-size: 12px; color: var(--accent); font-weight: 700; }
.ach-locked { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
/* Rejoin banner on the main menu */
.rejoin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); max-width: 440px; }
.rejoin-text { flex: 1; min-width: 160px; font-weight: 700; }
.rejoin-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); animation: livePulse 1.6s ease-in-out infinite; }
@keyframes livePulse { 50% { box-shadow: 0 0 0 6px transparent; } }
/* Player page */
.profile { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.av { flex: none; display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-family: var(--display); font-weight: 800; line-height: 1; width: 34px; height: 34px; font-size: 17px; user-select: none; }
.av.avatar { width: 64px; height: 64px; font-size: 30px; box-shadow: 0 0 0 4px var(--accent-soft); }
.av.av-sm { width: 34px; height: 34px; font-size: 17px; }
.av.av-xs { width: 20px; height: 20px; font-size: 11px; }
.profile { flex-wrap: wrap; }
.av-picker { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.av-row { display: flex; flex-wrap: wrap; gap: 8px; }
.av-pick { padding: 3px; border-radius: 50%; border: 2px solid transparent; background: none; cursor: pointer; line-height: 0; transition: transform .15s ease, border-color .15s ease; }
.av-pick:hover { transform: scale(1.08); }
.av-pick[aria-pressed="true"] { border-color: var(--accent); }
.player-link { display: inline-flex; align-items: center; gap: 6px; }
.plate-top .av-xs, .lseat .av-xs { margin-right: 2px; }
.profile-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.profile-name { font-family: var(--display); font-weight: 800; font-size: 20px; padding: 6px 10px; }
.player-tabs { align-self: flex-start; }
.player-section { display: flex; flex-direction: column; gap: 12px; }
.player-section h2 { font-size: 22px; }
/* Stats page */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.stat { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.stat-icon { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); color: var(--muted); font-weight: 800; }
.stat b { font-family: var(--display); font-size: 24px; }
.stat-sub { color: var(--accent); font-weight: 700; }
.stat .hint { display: block; }
/* Main menu options */
.menu-opts { display: flex; flex-direction: column; gap: 10px; max-width: 440px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .12s, transform .12s; }
.opt:hover { border-color: var(--accent); transform: translateX(2px); }
.opt-glyph { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 18px; }
.opt-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.opt-text b { font-size: 16px; }
.opt-arrow { color: var(--muted); font-size: 18px; }
.opt:hover .opt-arrow { color: var(--accent); }
/* Online: menu, lobby, reactions */
.text-in { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; min-width: 0; }
.code-in { width: 9.5em; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.invite-in { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.err { margin: 0; color: var(--warn); font-weight: 700; }
.code { font-family: var(--display); letter-spacing: .06em; color: var(--accent); }
.lobby { max-width: 640px; }
.lseats { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lseat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 48px; }
.lseat + .lseat { border-top: 1px solid var(--line); }
.lseat .seatno { width: 20px; color: var(--muted); text-align: right; flex: none; }
.lname { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lctl { display: flex; gap: 4px; flex: none; }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 6px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.react-bar { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.react-btn { border: 0; background: transparent; font-size: 18px; width: 32px; height: 30px; border-radius: 999px; cursor: pointer; line-height: 1; }
.react-btn:hover { background: var(--surface-2); }
.react-bubble { position: absolute; top: -18px; right: 10px; font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1) both; pointer-events: none; }
@keyframes pop { from { transform: scale(.3) translateY(10px); opacity: 0; } }
.pause .modal { text-align: center; align-items: center; }
.pause h2 { font-size: 22px; }
/* Home scene */
.home { flex: 1; width: 100%; max-width: 1180px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center; padding-block: 48px; }
.home-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.feats { list-style: none; margin: 6px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.feats li { display: flex; gap: 14px; align-items: center; }
.feat-glyph { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 18px; }
.hero-art { position: relative; height: 460px; min-width: 0; }
.art-felt { position: absolute; inset: 6% 2% 6%; border-radius: 50%; background: radial-gradient(ellipse at 50% 38%, var(--felt-hi), var(--felt) 70%); box-shadow: inset 0 0 0 12px var(--felt-rim), inset 0 0 0 13px var(--line); }
.card.xl { --w: 96px; }
.art-trick { position: absolute; left: 50%; top: 50%; }
.art-card { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) translate(calc(var(--x) * 104px), calc(var(--y) * 84px)) rotate(var(--r)); animation: dealIn .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 140ms + 150ms); }
.art-card.win .card { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
@keyframes dealIn { from { transform: translate(-50%, -50%) translate(calc(var(--x) * 260px), calc(var(--y) * 220px)) rotate(0deg); opacity: 0; } }
.art-trump { position: absolute; right: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(8deg); }
.art-bids { position: absolute; right: 6%; bottom: 3%; display: flex; gap: 6px; transform: rotate(-4deg); }
.art-bids span { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
.art-bids .x { text-decoration: line-through; color: var(--muted); opacity: .6; }
.art-bids .on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
@media (max-width: 860px) {
  .home { grid-template-columns: 1fr; padding-block: 32px 80px; }
  .hero-art { height: 360px; }
  .card.xl { --w: 74px; }
  .art-card { transform: translate(-50%, -50%) translate(calc(var(--x) * 82px), calc(var(--y) * 66px)) rotate(var(--r)); }
  .art-trump .card { --w: 56px; }
}
@media (prefers-reduced-motion: reduce) { .art-card { animation: none; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.names { display: grid; grid-template-columns: 1fr; gap: 8px; }
.seg.kind button { padding: 6px 10px; font-size: 13px; }
.names label { display: flex; align-items: center; gap: 8px; }
.names .seatno { width: 22px; color: var(--muted); font-size: 13px; text-align: right; }
.names input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.hint { color: var(--muted); font-size: 13px; }
.linkrow { display: flex; gap: 6px; }

/* Game header */
.topbar { display: flex; align-items: center; gap: 16px; padding-block: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.roundinfo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.roundinfo .item { display: flex; flex-direction: column; }
.roundinfo .val { font-weight: 700; font-size: 16px; }
.trumpval { display: flex; align-items: center; gap: 8px; }
.suit-badge { font-size: 20px; line-height: 1; }
.suit-badge.red { color: var(--ink-red); }
.topbar .spacer { flex: 1; }
.topbar { padding-right: 48px; }
.bids-pill { font-weight: 700; font-size: 15px; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.theme-toggle { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 40; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.theme-toggle:hover { color: var(--fg); border-color: var(--muted); }
.theme-toggle svg { width: 17px; height: 17px; transition: transform .4s ease; }
.theme-toggle:hover svg { transform: rotate(60deg); }
.modal.settings { width: min(100%, 440px); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 10px; border-top: 1px solid var(--line); }
.setting-name { font-weight: 700; }

/* Table scene: an oval table, seat plates around its rim, played cards in front of each seat */
.tablewrap { flex: 1 0 auto; min-height: 400px; position: relative; margin-block: 14px 4px; }
.tablewrap.continue { cursor: pointer; }
.felt { position: absolute; inset: 0; }
.felt-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 40%; text-align: center; z-index: 1; }
.tcard { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); z-index: 2; animation: land .25s ease-out both; }
.tcard .card.trumpcard { background: linear-gradient(var(--accent-tint), var(--accent-tint)), var(--card); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.tcard .card.trumpcard::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 6px; height: 3px; border-radius: 2px; background: var(--accent); }
.tcard.win { z-index: 3; }
.tcard.flown:not(.collect) { animation: none; }
/* Plates glide to new seats when the bottom player changes (hotseat) instead of jumping */

/* ============ BOT (level 2: rules of thumb, sees only its own hand + public info) ============ */
const Bot = (() => {
  const { suit, rank } = Engine;
  const asc = (a, b) => rank(a) - rank(b);
  const low = (arr) => arr.slice().sort(asc)[0];
  const high = (arr) => arr.slice().sort(asc)[arr.length - 1];

  /* Expected tricks from the hand alone. */
  function estimate(r, p) {
    const hand = r.hands[p], n = r.hands.length, T = r.trump;
    const by = { S: [], H: [], C: [], D: [] };
    hand.forEach((c) => by[suit(c)].push(rank(c)));
    for (const s in by) by[s].sort((a, b) => b - a);
    const trumps = by[T];
    const crowd = n >= 5 ? 0.85 : 1; // more players, more chances to be trumped
    let e = 0;
    trumps.forEach((rk, i) => {
      let v = rk === 14 ? 0.95 : rk === 13 ? 0.8 : rk === 12 ? 0.6 : rk === 11 ? 0.45 : rk === 10 ? 0.35 : 0.25;
      if (i >= 2) v = Math.max(v, 0.55); // long trump suit wins late tricks
      e += v;
    });
    let spareTrumps = Math.max(0, trumps.length - 1);
    for (const s of Engine.SUITS) {
      if (s === T) continue;
      const cs = by[s], L = cs.length;
      if (L === 0) {
        if (spareTrumps > 0 && r.cards > 1) { e += 0.3; spareTrumps--; }
        continue;
      }
      const hasA = cs.includes(14), hasK = cs.includes(13);
      if (hasA) e += (L <= 3 ? 0.85 : 0.6) * crowd;
      if (hasK) e += (hasA ? 0.55 : L >= 2 ? 0.3 : 0.1) * crowd;
      if (cs.includes(12) && hasA && hasK) e += 0.15 * crowd;
    }
    return e;
  }
  function bid(r, p) {
    const e = estimate(r, p);
    let b = Math.max(0, Math.min(r.cards, Math.round(e)));
    const f = Engine.forbiddenBid(r, p);
    if (b === f) {
      const up = b + 1, down = b - 1;
      const preferUp = e > b;
      if (preferUp && up <= r.cards) b = up;
      else if (down >= 0) b = down;
      else b = up;
    }
    return b;
  }
  function play(r, p) {
    const legal = Engine.legalInfo(r, p).cards;
    if (legal.length === 1) return legal[0];
    const n = r.hands.length, T = r.trump;
    const isT = (c) => suit(c) === T;
    const nonT = (arr) => arr.filter((c) => !isT(c));
    const preferNonT = (arr) => (nonT(arr).length ? nonT(arr) : arr);
    const need = r.bids[p] - r.tricks[p];

    if (!r.trick.length) {
      if (need > 0) {
        const aces = nonT(legal).filter((c) => rank(c) === 14);
        if (aces.length) return aces[0];
        const tr = legal.filter(isT);
        if (tr.length && rank(high(tr)) >= 13) return high(tr);

      // lead low, from the longest side suit
      const side = nonT(legal);
      if (!side.length) return low(legal);
      const count = {}; side.forEach((c) => { count[suit(c)] = (count[suit(c)] || 0) + 1; });

      return low(preferNonT(lose));
    }

  }

})();

/* After every trick: the winning card pops and the cards slide straight into the winner's plate.

const COLLECT_MS = 800;

}

    const fresh = r.phase === 'bidding' && r.bids.every((b) => b == null);
    ui.deal = fresh ? { key, at: now, ...dealTiming(r, game.names.length) } : null;
    ui.seenRound = { key, bids: r.bids.slice() };
    ui.bidBubbles = {};
    return;
  }
  r.bids.forEach((b, i) => {
    if (b != null && ui.seenRound.bids[i] == null) {
      ui.bidBubbles[i] = { v: b, at: now };
      setTimeout(() => { if (ui.bidBubbles[i] && Date.now() - ui.bidBubbles[i].at >= BUBBLE_MS) { delete ui.bidBubbles[i]; if (ui.screen === 'game') render(); } }, BUBBLE_MS + 50);

    html += `<span class="dealcard" id="dc-${k}" data-anim="deal${at}" style="--x:${p.x}%;--y:${p.y}%;animation-delay:${Math.round(k * step - elapsed)}ms"></span>`;

function handArrival(r, n, seat, j) {

    const lastH = r.phase === 'roundDone' ? game.history[game.history.length - 1] : null;
    const result = lastH ? (lastH.bids[i] === lastH.tricks[i] ? 'res-made' : 'res-miss') : '';
    const resChip = lastH ? `<span class="res-pts">+${lastH.points[i]}</span>` : '';

    const boom = lastH && lastH.bids[i] > 3 && lastH.bids[i] === lastH.tricks[i]
      ? `<div class="boom" id="boom-${i}" data-anim="boom${game.history.length}" style="left:${p.x}%;top:${p.y}%" aria-hidden="true"><b></b><b></b>${BOOM_SPARKS}</div>` : '';
    return `${boom}<div class="plate ${r.turn === i ? 'turn' : ''} ${won ? 'won' : ''} ${streak ? 'fire' : ''} ${result} ${state}" id="plate-${i}" style="left:${p.x}%;top:${p.y}%" ${streak ? `title="${esc(t('onFire', { n: streak }))}"` : ''}>
      ${bubble}
      ${react ? `<span class="react-bubble" data-anim="rb${react.at}" aria-hidden="true">${react.e}</span>` : ''}
      <div class="plate-top">${game.avatars && game.avatars[i] ? avatarHTML(game.avatars[i], nm, 'av-xs') : ''}<span class="seat-name">${esc(nm)}${me ? ` <span class="hint">(${t('you')})</span>` : ''}</span>${chips}${resChip}</div>
      <div class="plate-stats num">
        <span><span class="label"><span class="wide-only">${t('bid')}</span><span class="narrow-only">${t('bidS')}</span></span> <b>${bid == null ? '–' : bid}</b></span>
        <span><span class="label"><span class="wide-only">${t('tricks')}</span><span class="narrow-only">${t('wonS')}</span></span> <b class="tricks-val">${tr}</b></span>
        <span><span class="label"><span class="wide-only">${t('score')}</span><span class="narrow-only">${t('ptsS')}</span></span> <b>${game.totals[i]}</b></span>
      </div>
    </div>`;
  }).join('');
  const done = r.phase === 'trickDone';
  const wp = done ? seatPos(r.trickWinner, n, anchor, 1) : null;
  // Remember when this trick finished so a redraw continues the slide instead of restarting it.
  let holdLeft = trickHold();
  if (done) {
    const key = game.roundIdx + ':' + r.tricks.reduce((a, b) => a + b, 0);
    if (!ui.trickAnim || ui.trickAnim.key !== key) ui.trickAnim = { key, at: Date.now() };
    holdLeft = trickHold() - (Date.now() - ui.trickAnim.at);
  }
  const played = r.trick.map((x, k) => {
    const p = seatPos(x.p, n, anchor, isNarrow() ? 0.44 : 0.52, true);
    const rot = ((x.p * 37 + k * 11) % 13) - 6;
    const win = done && x.p === r.trickWinner;
    const toWinner = wp ? `;--wx:${wp.x}%;--wy:${wp.y}%;--hold:${holdLeft}ms;--collect:${COLLECT_MS}ms` : '';
    return `<div class="tcard ${win ? 'win' : ''} ${done ? 'collect' : ''}" id="tc-${x.c}" data-p="${x.p}" data-anim="${done ? 'collect' + ui.trickAnim.at : 'play'}" style="left:${p.x}%;top:${p.y}%;--r:${rot}deg${toWinner}">${cardHTML(x.c, { cls: Engine.suit(x.c) === r.trump ? 'trumpcard' : '' })}</div>`;
  }).join('');
  let center;
  const tapToContinue = false;
  if (r.phase === 'bidding') {
    const big = r.indicator ? cardHTML(r.indicator, { size: 'lg' }) : `<span class="suit-badge ${isRed(r.trump) ? 'red' : ''}" style="font-size:64px">${SYM[r.trump]}</span>`;
    center = `<span class="label">${t('trump')}</span>${big}
      <div class="table-status">${suitName(r.trump)}${r.indicator ? '' : ` <span class="hint">(${t('drawn')})</span>`}</div>
      <div class="table-sub">${t('waitingBid', { name: esc(game.names[r.turn]) })}</div>`;
  } else if (r.phase === 'roundDone') {
    center = `<div class="table-status">${t('roundComplete', { i: game.history.length })}</div>
      <div class="table-sub">${game.history.length >= game.schedule.length ? t('lastOnline') : t('dealingNext')}</div>`;
  } else if (r.phase === 'trickDone') {
    center = `<div class="table-status">${t('winsTrick', { name: esc(game.names[r.trickWinner]) })}</div>`;
  } else {
    center = `<div class="table-status">${r.trick.length ? t('toPlay', { name: esc(game.names[r.turn]) }) : t('leads', { name: esc(game.names[r.turn]) })}</div>`;
  }
  return `<section class="tablewrap ${n >= 5 ? 'many' : ''} ${tapToContinue ? 'continue' : ''}" ${tapToContinue ? 'data-a="continueTrick"' : ''}>
    <div class="felt"></div>
    ${dealLayer(r, n, anchor)}
    ${played}
    <div class="felt-center ph-${r.phase}">${center}</div>
    ${plates}
  </section>`;
}

function sheetTable() {

function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); }
const showCode = (c) => (c && c.length === 6 ? c.slice(0, 4) + '-' + c.slice(4) : c || '');

function genCode() {

/* ============ ACHIEVEMENTS (kept per device; only human players on this device earn them) ============ */

const ACHS = [

  { id: 'hoarder', icon: '💰' }, { id: 'overachiever', icon: '🚀' }, { id: 'repeatOffender', icon: '🔁' }
];
const achById = (id) => ACHS.find((a) => a.id === id);
const achText = (id) => (TEXT[lang].achT[id] || TEXT.en.achT[id]);
let achState = (() => { try { const s = JSON.parse(store.get(ACH_KEY)); if (s && s.u) return Object.assign({ count: 0, seen: [], points: 0, sitStreak: 0 }, s); } catch (e) {} return { u: {}, count: 0, seen: [], points: 0, sitStreak: 0 }; })();
function achSave() { store.set(ACH_KEY, JSON.stringify(achState)); }
function toast(html) {

}
function achToast(id, who) {

/* Seats whose achievements count on this device. */
function trackedSeats() {
  if (!game) return [];
  if (net.active) return net.mySeat != null ? [net.mySeat] : [];
  return humans();
}
function unlock(id, p) {
  if (achState.u[id]) return;
  achState.u[id] = Date.now(); achSave();
  Sfx.fx('chime');
  // On a shared device, say which player earned it.
  achToast(id, !net.active && trackedSeats().length > 1 ? game.names[p] : null);
  if (net.active) {
    if (net.isHost) hostAnnounceAch(p, id);
    else send(net.hostConn, { t: 'ach', id });
  }
}
function hostAnnounceAch(seat, id) {
  net.seats.forEach((s) => { if (s.kind === 'human' && s.peerId && net.conns[s.peerId]) send(net.conns[s.peerId], { t: 'achSeen', seat, id }); });
}
function trickAch(trick, trump, p) {
  const mine = trick.find((x) => x.p === p); if (!mine) return;
  const isT = Engine.suit(mine.c) === trump;
  if (isT && Engine.rank(mine.c) === 6) unlock('underdog', p);
  if (isT && trick.some((x) => x.p !== p && Engine.rank(x.c) === 14 && Engine.suit(x.c) !== trump)) unlock('trumpKill', p);
}
function cumulativeAfter(H, k, n) { const c = Array(n).fill(0); for (let i = 0; i < k; i++) H[i].points.forEach((x, j) => { c[j] += x; }); return c; }
/* Checks are safe to repeat: an achievement unlocks once and later checks skip it. */
function checkAchievements() {
  const seats = trackedSeats(); if (!seats.length) return;
  const H = game.history || [], r = game.round, n = game.names.length;
  for (const p of seats) {
    let run = 0, best = 0;
    H.forEach((h) => {
      const bid = h.bids[p], won = h.tricks[p], exact = bid === won;
      if (exact) unlock('spotOn', p);
      if (exact && bid === 0) unlock('zero', p);
      if (h.cards >= 4 && bid === h.cards && won === h.cards) unlock('sweep', p);
      if (h.cards >= 7 && bid === 0 && won === 0) unlock('nerves', p);
      if (exact && bid >= 6) unlock('bigTalk', p);
      if (h.cards >= 6 && bid === h.cards && won === h.cards) unlock('allIn', p);
      if (won - bid >= 3) unlock('overachiever', p);
      run = exact ? run + 1 : 0; best = Math.max(best, run);
    });
    if (best >= 5) unlock('sharp', p);
    if (best >= 10) unlock('mindReader', p);
    if (game.streak && game.streak.p === p) {
      if (game.streak.n >= 3) unlock('fire', p);
      if (game.streak.n >= 5) unlock('inferno', p);
      if (game.streak.n >= 7) unlock('wildfire', p);
    }
    if (r && r.phase === 'trickDone' && r.trickWinner === p) trickAch(r.trick, r.trump, p);
    if (r && r.lastTrick && r.lastTrick.winner === p) trickAch(r.lastTrick.trick, r.trump, p);
    if (game.over && H.length === game.schedule.length) {
      const first = Engine.ranking(game)[0], loser = Engine.sitaratas(game);
      if (first === p) unlock('champion', p);
      if (H.every((h) => h.bids[p] === h.tricks[p])) unlock('flawless', p);
      if (loser === p) unlock('sitaratas', p);
      const half = cumulativeAfter(H, Math.floor(H.length / 2), n);
      if (first === p && half[p] === Math.min(...half)) unlock('comeback', p);
      const late = cumulativeAfter(H, H.length - 3, n);
      if (late[p] === Math.min(...late) && loser !== p) unlock('escape', p);
      const order = Engine.ranking(game), myPlace = order.indexOf(p);
      if (first === p) {
        const margin = game.totals[p] - game.totals[order[1]];
        if (margin === 1) unlock('photoFinish', p);
        if (margin >= 30) unlock('landslide', p);
        if (game.half) unlock('halfHero', p);
        if (n === 6) unlock('fullHouse', p);
      }
      // Total domination: at the top of the scores (a shared top counts) after every single round.
      let top = true;
      for (let k = 1; k <= H.length && top; k++) { const c = cumulativeAfter(H, k, n); if (c[p] < Math.max(...c)) top = false; }
      if (top) unlock('domination', p);
      const botsBeaten = (game.bots || []).filter((isB, b) => isB && order.indexOf(b) > myPlace).length;
      if (botsBeaten >= 3) unlock('robotSlayer', p);
    }
  }
  if (game.over) {
    const gid = game.id || (game.names.join('|') + '|' + game.firstDealer + '|' + game.totals.join(','));
    if (!achState.seen.includes(gid)) {
      achState.seen = achState.seen.concat(gid).slice(-100); achState.count++;
      // Running totals for the long-term achievements (counted from this version on).
      achState.points += seats.reduce((s, p) => s + game.totals[p], 0);
      achState.sitStreak = seats.includes(Engine.sitaratas(game)) ? achState.sitStreak + 1 : 0;
      achSave();
      if (achState.count >= 10) unlock('regular', seats[0]);
      if (achState.count >= 50) unlock('veteran', seats[0]);
      if (achState.points >= 1000) unlock('hoarder', seats[0]);
      if (achState.sitStreak >= 3) unlock('repeatOffender', seats[0]);
    }
  }
}

/* ============ SOUND (synthesised with Web Audio; off until the player turns it on) ============ */
const SOUND_KEY = 'sitaratas.sound';
const Sfx = (() => {
  let ctx = null, on = store.get(SOUND_KEY) === '1';
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(c, dur) {
    const b = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  }
  function gainEnv(c, t, attack, peak, decay) {
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    return g;
  }
  function tone(c, t, freq, type, peak, dur) {
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    const g = gainEnv(c, t, 0.01, peak, dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function burst(c, t, dur, type, freq, q, peak) {
    const n = noise(c, dur), f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    const g = gainEnv(c, t, 0.003, peak, dur); n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + dur + 0.02);
    return f;
  }
  const sounds = {
    card(c, t) { burst(c, t, 0.07, 'bandpass', 2300, 0.9, 0.35); tone(c, t, 180, 'sine', 0.08, 0.05); },        // card snap
    deal(c, t, step, count) { for (let k = 0; k < Math.min(count, 40); k++) burst(c, t + (k * step) / 1000, 0.03, 'highpass', 3200, 0.7, 0.09); },
    win(c, t) { const f = burst(c, t, 0.32, 'bandpass', 700, 1.2, 0.14); f.frequency.exponentialRampToValueAtTime(2600, t + 0.3); }, // swoosh
    ping(c, t) { tone(c, t, 880, 'sine', 0.09, 0.18); tone(c, t + 0.09, 1320, 'sine', 0.07, 0.22); },          // your turn
    chime(c, t) { [659, 831, 988, 1319].forEach((f, i) => tone(c, t + i * 0.08, f, 'triangle', 0.12, 0.45)); }, // exact bid / achievement
    boom(c, t) {                                                                                                 // explosion
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.55);
      const g = gainEnv(c, t, 0.005, 0.6, 0.6); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.7);
      const f = burst(c, t, 0.8, 'lowpass', 3000, 0.5, 0.45); f.frequency.exponentialRampToValueAtTime(200, t + 0.8);
    },
    crackle(c, t) { for (let k = 0; k < 14; k++) burst(c, t + Math.random() * 0.9, 0.02, 'highpass', 1500 + Math.random() * 3000, 0.6, 0.12 + Math.random() * 0.1); } // on fire
  };
  function fx(name, ...args) { if (!on) return; const c = ac(); if (!c) return; try { sounds[name](c, c.currentTime + 0.01, ...args); } catch (e) {} }
  function toggle() { on = !on; store.set(SOUND_KEY, on ? '1' : '0'); if (on) fx('ping'); }
  return { fx, toggle, get on() { return on; } };
})();
/* Watch the game state between screen updates and play a sound for each new event (same for host, friends and hotseat). */
function soundEvents() {
  const r = game && !game.over && game.round;
  if (!r || ui.screen !== 'game') { ui.snd = null; return; }
  const s = { key: (game.id || '') + ':' + game.roundIdx, trick: r.trick.length, phase: r.phase, turn: r.turn,
    streak: game.streak ? game.streak.p + ':' + game.streak.n : '', hist: game.history.length, mine: myTurn() };
  const p = ui.snd; ui.snd = s;
  if (!p || !Sfx.on) return;
  if (s.key !== p.key && ui.deal && dealActive()) Sfx.fx('deal', ui.deal.step, ui.deal.total);
  if (s.key === p.key && s.trick > p.trick) Sfx.fx('card');
  if (s.phase === 'trickDone' && p.phase !== 'trickDone') Sfx.fx('win');
  if (s.hist > p.hist) {
    const h = game.history[s.hist - 1], mine = trackedSeats();
    if (h.bids.some((b, i) => b > 3 && b === h.tricks[i])) Sfx.fx('boom');
    else if (mine.some((i) => h.bids[i] === h.tricks[i])) Sfx.fx('chime');
  }
  if (game.streak && game.streak.n === 3 && s.streak !== p.streak) Sfx.fx('crackle');
  if (s.mine && !p.mine) Sfx.fx('ping');
}

/* ============ PLAYER STATS (per device, like achievements; only humans on this device count) ============ */
const STATS_KEY = 'sitaratas.stats.v1';
const freshStats = () => ({ games: 0, wins: 0, sitaratas: 0, rounds: 0, exact: 0, bestStreak: 0, highScore: 0, points: 0, seenRounds: [], seenGames: [] });
let stats = (() => { try { const s = JSON.parse(store.get(STATS_KEY)); if (s && typeof s.games === 'number') return Object.assign(freshStats(), s); } catch (e) {} return freshStats(); })();
function saveStats() { store.set(STATS_KEY, JSON.stringify(stats)); }
function resetStats() { stats = freshStats(); saveStats(); }
/* Safe to call on every update: each round and each finished game is counted once. */
function trackStats() {
  const seats = trackedSeats(); if (!seats.length || !game) return;
  const gid = game.id || (game.names.join('|') + '|' + game.firstDealer);
  let changed = false;
  game.history.forEach((h, idx) => {
    const k = gid + ':' + idx;
    if (stats.seenRounds.includes(k)) return;
    stats.seenRounds.push(k); changed = true;
    seats.forEach((p) => { stats.rounds++; if (h.bids[p] === h.tricks[p]) stats.exact++; });
  });
  if (game.streak && seats.includes(game.streak.p) && game.streak.n > stats.bestStreak) { stats.bestStreak = game.streak.n; changed = true; }
  if (game.over && !stats.seenGames.includes(gid)) {
    stats.seenGames.push(gid); changed = true;
    const first = Engine.ranking(game)[0], loser = Engine.sitaratas(game);
    seats.forEach((p) => {
      stats.games++; stats.points += game.totals[p];
      if (first === p) stats.wins++;
      if (loser === p) stats.sitaratas++;
      stats.highScore = Math.max(stats.highScore, game.totals[p]);
    });
  }
  if (changed) {
    stats.seenRounds = stats.seenRounds.slice(-400); stats.seenGames = stats.seenGames.slice(-100);
    saveStats();
  }
}
function statsSection() {

/* ============ RENDER ============ */
function render() {
  if (ui.screen === 'game' && game) {
    try { checkAchievements(); } catch (e) {}
    try { trackStats(); } catch (e) {}
    if (!game.over) trackRoundEvents();
  }
  try { soundEvents(); } catch (e) {}
  document.documentElement.lang = lang;
  const app = $('#app');
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  let html;
  if (ui.screen === 'home') html = homeView();
  else if (ui.screen === 'setup') html = setupView();
  else if (ui.screen === 'online') html = onlineView();
  else if (ui.screen === 'lobby') html = lobbyView();
  else if (ui.screen === 'player') html = playerView();
  else if (!game) html = homeView();
  else if (game.over) html = endView();
  else {
    const r = game.round;
    const runsTimers = !net.active || net.isHost;
    const paused = isPaused();
    html = topbar() + tableScene() + dockView();
    if (r.phase === 'roundDone') {
      // Plates glow green/red for the round's result; the full summary only appears at the halfway round.
      const half = isHalfwayRound();
      if (half) html += bannerView();
      if (runsTimers && !paused && !ui.bannerTimer) ui.bannerTimer = setTimeout(advanceRound, half ? 4000 : RESULT_MS);
    } else if (!net.active && needsCover() && !ui.modal) html += coverView();
    if (runsTimers && !paused && !ui.botTimer && (net.active || !ui.modal)) {
      if ((r.phase === 'bidding' || r.phase === 'playing') && isBot(r.turn)) {
        // Bots wait for the deal animation to finish before their first bid.
        const dealLeft = dealActive() ? ui.deal.at + ui.deal.duration - Date.now() + 250 : 0;
        ui.botTimer = setTimeout(botStep, Math.max(BOT_DELAY, dealLeft));
      }
      else if (r.phase === 'trickDone') {
        const elapsed = ui.trickAnim ? Date.now() - ui.trickAnim.at : 0;
        ui.botTimer = setTimeout(autoContinueTrick, Math.max(0, trickHold() + COLLECT_MS - elapsed));
      }
    }
    html += pauseView();
    // Your turn: a soft blue glow around the edges of the screen.
    if (myTurn() && !(needsCover() && !net.active)) html += '<div class="turn-glow" id="turnGlow" aria-hidden="true"></div>';
  }
  if (ui.modal) html += modalView();
  html += settingsButton();
  const before = snapshotRects();
  paint(app, html);
  afterPaint(before, app);
  const cover = $('#cover'); if (cover && document.activeElement !== cover) cover.focus();
  if (focusId && !cover && (!document.activeElement || document.activeElement.id !== focusId)) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/* ============ SMOOTH UPDATES ============ */
/* Instead of rebuilding the screen, morphdom changes only what differs, so elements stay put,
   CSS transitions run, and animations already playing are not restarted. */
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function paint(app, html) {
  if (!window.morphdom) { app.innerHTML = html; return; }
  const next = app.cloneNode(false);
  next.innerHTML = html;
  window.morphdom(app, next, {
    childrenOnly: true,
    onBeforeElUpdated(fromEl, toEl) {
      if (fromEl.isEqualNode(toEl)) return false;
      // An element mid-animation keeps its own timing (its inline delay was set when it first appeared).
      const k = fromEl.getAttribute('data-anim');
      if (k && k === toEl.getAttribute('data-anim')) {
        const s = fromEl.getAttribute('style');
        if (s == null) toEl.removeAttribute('style'); else toEl.setAttribute('style', s);
      }
      if (fromEl.classList.contains('flown')) toEl.classList.add('flown');
      return true;
    }
  });
}
/* Remember where hand cards and seat plates were, so moves can be animated from there (FLIP). */
function snapshotRects() {
  const m = new Map();
  document.querySelectorAll('[id^="hc-"], [id^="plate-"]').forEach((el) => m.set(el.id, el.getBoundingClientRect()));
  return { m, tc: new Set([...document.querySelectorAll('[id^="tc-"]')].map((e) => e.id)), screen: lastScreenKey };
}
let lastScreenKey = null;
function afterPaint(before, app) {
  const screenKey = ui.screen + (game && game.over ? ':over' : '');
  const changedScreen = screenKey !== lastScreenKey;
  lastScreenKey = screenKey;
  if (reduceMotion() || !app.animate) return;
  if (changedScreen && before.screen != null) app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
  // Cards still in your hand glide into their new places when one leaves.
  document.querySelectorAll('[id^="hc-"]').forEach((el) => {
    const r0 = before.m.get(el.id); if (!r0) return;
    const r1 = el.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], { duration: 280, easing: 'cubic-bezier(.2, .8, .2, 1)' });
  });
  // A newly played card flies from your hand, or from the player's seat, to its spot on the table.
  document.querySelectorAll('[id^="tc-"]').forEach((el) => {
    if (before.tc.has(el.id)) return;
    const c = el.id.slice(3), p = el.dataset.p;
    const plateNow = document.getElementById('plate-' + p);
    const r0 = before.m.get('hc-' + c) || before.m.get('plate-' + p) || (plateNow && plateNow.getBoundingClientRect());
    const inner = el.querySelector('.card');
    if (!r0 || !inner) return;
    const r1 = inner.getBoundingClientRect();
    const dx = (r0.left + r0.width / 2) - (r1.left + r1.width / 2), dy = (r0.top + r0.height / 2) - (r1.top + r1.height / 2);
    el.classList.add('flown');
    inner.animate([{ transform: `translate(${dx}px, ${dy}px) scale(.85)`, opacity: 0.85 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2, .8, .2, 1)' });
  });
}

/* ============ ACTIONS ============ */
/* Persist (local) or save + send to friends (host). Friends never change the game themselves. */
function afterChange() {
  if (net.active) { if (net.isHost) { hostSave(); hostBroadcast(); } }
  else save();
}
function advanceRound() {
  clearTimeout(ui.bannerTimer); ui.bannerTimer = null;
  if (!game || !game.round || game.round.phase !== 'roundDone' || isPaused()) return;
  if (net.active && !net.isHost) return;
  Engine.nextRound(game);
  if (net.active) ui.viewer = net.mySeat; else resetViewer();
  ui.selBid = null; ui.selCard = null;
  afterChange(); render();
}
function autoContinueTrick() {
  ui.botTimer = null;
  if (!game || !game.round || game.round.phase !== 'trickDone' || isPaused()) return;
  Engine.continueTrick(game); ui.trickAnim = null; afterChange(); render();
}
function botStep() {
  ui.botTimer = null;
  const r = game && !game.over && game.round;
  if (!r || ui.screen !== 'game' || !isBot(r.turn) || isPaused()) return;
  if (net.active && !net.isHost) return;
  if (r.phase === 'bidding') Engine.placeBid(game, r.turn, Bot.bid(r, r.turn));
  else if (r.phase === 'playing') Engine.playCard(game, r.turn, Bot.play(r, r.turn));
  else return;
  afterChange(); render();
}
function startGame(names, order, bots, half) {
  clearTimers();
  game = Engine.newGame(names, order, half);
  game.bots = bots.slice(0, names.length);
  // On one device: if you're the only human, your picture goes on your seat; with several humans each gets their initial.
  const humanSeats = game.bots.map((b, i) => (b ? -1 : i)).filter((i) => i >= 0);
  game.avatars = game.bots.map((b) => (b ? null : humanSeats.length === 1 ? myAvatar : 'initial'));
  ui.screen = 'game'; resetViewer(); ui.selBid = null; ui.selCard = null; ui.modal = null;
  save(); render();
}
function myTurn() { const r = game && game.round; return !!r && r.turn === ui.viewer && !isBot(r.turn) && !isPaused(); }
function act(a, el) {
  if (a.startsWith('o') && a.length > 1 && a[1] === a[1].toUpperCase()) { if (net.active && net.isHost) hostAct(a, el); return; }
  switch (a) {
    case 'toSetup': ui.screen = 'setup'; break;
    case 'home': net.error = ''; joinCode = ''; ui.screen = 'home'; break;
    case 'continue': ui.screen = 'game'; resetViewer(); break;
    case 'toPlayer': ui.screen = 'player'; ui.statsReset = false; break;
    case 'playerTab': ui.playerTab = el.dataset.v; ui.statsReset = false; break;
    case 'pickAvatar': myAvatar = validAvatar(el.dataset.v); store.set(AVATAR_KEY, myAvatar); break;
    case 'statsResetAsk': ui.statsReset = true; break;
    case 'statsResetNo': ui.statsReset = false; break;
    case 'statsResetYes': resetStats(); ui.statsReset = false; break;
    case 'sound': Sfx.toggle(); break;
    case 'resumeRoom': hostStart(true); return;
    case 'forgetRoom': store.del(HOST_KEY); break;
    case 'rejoinRoom': {
      const j = lastJoined(); if (!j) break;
      joinCode = j.room;
      if (net.name.trim()) { clientJoin(j.room); return; }
      ui.onlineMode = 'join'; ui.screen = 'online'; break;
    }
    case 'forgetJoin': store.del(LAST_JOIN_KEY); break;
    case 'toHost': net.error = ''; joinCode = ''; ui.onlineMode = 'host'; ui.screen = 'online'; break;
    case 'toJoin': net.error = ''; ui.onlineMode = 'join'; ui.screen = 'online'; break;
    case 'hostNew': case 'hostResume': case 'joinGo': {
      const nameEl = $('#onName'); if (nameEl) net.name = nameEl.value;
      if (!net.name.trim()) { net.error = 'nameNeeded'; break; }
      net.name = cleanName(net.name); store.set(NAME_KEY, net.name);
      if (a === 'joinGo') {
        const codeEl = $('#onCode'); const code = normCode(codeEl ? codeEl.value : joinCode);
        if (code.length !== 6) { net.error = 'codeNeeded'; break; }
        joinCode = code; clientJoin(code);
      } else hostStart(a === 'hostResume');
      return;
    }
    case 'copyInvite': {
      const link = inviteLink(), inp = $('#inviteLink');
      const done = () => { net.copied = true; render(); setTimeout(() => { net.copied = false; render(); }, 1500); };
      try { navigator.clipboard.writeText(link).then(done, () => { if (inp) inp.select(); }); } catch (e) { if (inp) inp.select(); }
      return;
    }
    case 'readyToggle': {
      const mine = net.lobby && net.lobby.seats[net.mySeat];
      send(net.hostConn, { t: 'ready', v: !(mine && mine.ready) }); return;
    }
    case 'leaveOnline': clientLeave(); break;
    case 'leaveAsk': ui.modal = 'abandon'; break;
    case 'endAsk': ui.modal = 'abandon'; break;
    case 'react': {
      const e = el.dataset.v, now = Date.now();
      if (!net.active || !REACTS.includes(e) || now - net.lastReact < 800) return;
      net.lastReact = now;
      if (net.isHost) hostReact(net.mySeat, e); else send(net.hostConn, { t: 'react', e });
      return;
    }
    case 'lang': lang = lang === 'en' ? 'et' : 'en'; store.set(LANG_KEY, lang); break;
    case 'rules': ui.modal = 'rules'; break;
    case 'sheet': ui.modal = 'sheet'; break;
    case 'menu': ui.modal = 'menu'; break;
    case 'lastTrick': ui.modal = 'lastTrick'; break;
    case 'closeModal': ui.modal = null; break;
    case 'abandonAsk': ui.modal = 'abandon'; break;
    case 'abandonYes':
      if (net.active) { if (net.isHost) { hostAct('oEnd'); return; } clientLeave(); break; }
      clearTimers(); game = null; store.del(SAVE_KEY); ui.modal = null; ui.screen = 'setup'; break;
    case 'count': ui.setup.count = +el.dataset.v; break;
    case 'order': ui.setup.order = el.dataset.v; break;
    case 'half': ui.setup.half = el.dataset.v === '1'; break;
    case 'kind': ui.setup.bots[+el.dataset.i] = el.dataset.v === '1'; break;
    case 'reveal': ui.viewer = game.round.turn; ui.selBid = null; ui.selCard = null; break;
    case 'bid': {
      if (!myTurn()) return;
      const v = +el.dataset.v;
      // Tapping the already-selected number confirms it, like playing a card.
      if (ui.selBid === v) { act('confirmBid'); return; }
      ui.selBid = v; break;
    }
    case 'confirmBid': {
      if (ui.selBid == null || !myTurn()) return;
      const b = ui.selBid; ui.selBid = null;
      if (net.active && !net.isHost) { send(net.hostConn, { t: 'bid', b }); break; }
      Engine.placeBid(game, game.round.turn, b); afterChange(); break;
    }
    case 'card': {
      if (!myTurn()) return;
      const id = el.dataset.id;
      if (ui.selCard === id) { act('confirmCard'); return; }
      ui.selCard = id; break;
    }
    case 'confirmCard': {
      if (!ui.selCard || !myTurn()) return;
      const c = ui.selCard; ui.selCard = null;
      if (net.active && !net.isHost) { send(net.hostConn, { t: 'play', c }); break; }
      Engine.playCard(game, game.round.turn, c); afterChange(); break;
    }
    case 'continueTrick': if (net.active) return; Engine.continueTrick(game); save(); break;
    case 'skipBanner': if (net.active) return; advanceRound(); return;
    case 'playAgain':
      if (net.active) { if (net.isHost) hostAct('oBackLobby'); return; }
      startGame(game.names, game.order, game.bots || [], game.half); return;
    case 'mainMenu':
      if (net.active) { if (net.isHost) { hostAct('oEnd'); return; } clientLeave(); break; }
      clearTimers(); store.del(SAVE_KEY); game = null; ui.screen = 'home'; break;
    case 'settings': ui.modal = 'settings'; break;
    case 'setTheme': setTheme(el.dataset.v); break;
    case 'setLang': lang = el.dataset.v === 'et' ? 'et' : 'en'; store.set(LANG_KEY, lang); break;
    case 'setSound': if ((el.dataset.v === '1') !== Sfx.on) Sfx.toggle(); break;
    case 'newGame': clearTimers(); store.del(SAVE_KEY); game = null; ui.screen = 'setup'; break;
    default: return;
  }
  render();
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'closeModalBg') { if (e.target === el) act('closeModal'); return; }
  e.preventDefault();
  act(a, el);
});
document.addEventListener('input', (e) => {
  if (e.target.matches('#setupForm input[data-i]')) ui.setup.names[+e.target.dataset.i] = e.target.value;
  if (e.target.id === 'onName') net.name = e.target.value;
  if (e.target.id === 'playerName') { net.name = e.target.value; store.set(NAME_KEY, net.name.trim().slice(0, 16)); }
  if (e.target.id === 'onCode') joinCode = normCode(e.target.value);
});
/* Update the avatar letter once the player finishes editing their name. */
document.addEventListener('change', (e) => { if (e.target.id === 'playerName' && ui.screen === 'player') render(); });
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'setupForm') return;
  e.preventDefault();
  startGame(playerNames(), ui.setup.order, ui.setup.bots, ui.setup.half);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.modal) { act('closeModal'); return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id === 'cover') { e.preventDefault(); act('reveal'); }
  if (e.key === 'Enter' && document.activeElement && (document.activeElement.id === 'onCode' || (document.activeElement.id === 'onName' && joinCode))) { e.preventDefault(); act('joinGo'); }
});
if (joinCode) ui.screen = 'online';
/* Seat positions depend on screen width (phone vs laptop), so redraw after a resize or rotation. */
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (ui.screen === 'game') render(); }, 150); });
render();
/* A friend reopening their invite link gets their seat back without retyping anything. */
if (joinCode && net.name && store.get(tokenKey(joinCode))) clientJoin(joinCode);
</script>

</body>
